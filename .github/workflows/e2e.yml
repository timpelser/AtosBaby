name: E2E tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# All runs share one Neon branch (`e2e`), which global-setup resets before
# each run. Two runs touching it at once would stomp on each other, so we
# serialize: a new run cancels a stale in-progress one for the same ref
# rather than letting them collide. That's safe because the branch always
# gets reset at the start of the *next* run regardless of how the previous
# one ended.
concurrency:
  group: e2e-neon-branch
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm run test:e2e
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          NEON_E2E_BRANCH_ID: ${{ secrets.NEON_E2E_BRANCH_ID }}
          NEON_E2E_SEED_BRANCH_ID: ${{ secrets.NEON_E2E_SEED_BRANCH_ID }}
          DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
          ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          CRON_SECRET: ${{ secrets.E2E_CRON_SECRET }}
          CI: true

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
